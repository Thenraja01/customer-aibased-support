events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Frontend upstream (Vite)
    upstream frontend {
        server host.docker.internal:5173;
    }

    # Backend upstream (Express API)
    upstream backend {
        server host.docker.internal:3030;
    }

    server {
        listen 80;
        server_name _;

        # API & Backend routes -> Express backend on 3030
        location ~ ^/(auth|users|chats|public|messages|tickets|ticket-templates|notifications|documents|document-verifications|organizations|branches|document-types|ai-sessions|audit-logs|faqs|rag|memory|knowledge-gaps|knowledge-graph|knowledge-nodes|topics|admin|search|ai|feedback|agent|api|widget|uploads) {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # App & Page routes -> Vite frontend on 5173
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
